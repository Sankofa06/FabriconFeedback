name: Feature request
description: Suggest a new feature, tuning change, or quality-of-life improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like to see?
      description: Describe the change in player-facing terms.
      placeholder: I would like...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would this help?
      description: Explain the problem, strategy, or moment this improves.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Aircraft programs
        - Contracts
        - Market and competitors
        - Research
        - Workforce
        - Finance
        - UI or accessibility
        - Other
    validations:
      required: false
